<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dom@dev ~ Dom Smith</title>
    <meta name="description" content="Dom Smith's terminal. Self-hosted AI, Discord bots, fantasy football tools and other things I build at home." />
    <meta property="og:title" content="dom@dev ~ Dom Smith" />
    <meta property="og:description" content="A terminal you can poke around in. Type help." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b0f0c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f0c'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%2339ff88'%3E%3E_%3C/text%3E%3C/svg%3E" />
    <!-- Apply the saved theme before first paint so the page never flashes the wrong colors -->
    <script>
      try { var t = localStorage.getItem("term-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="particles" aria-hidden="true"></canvas>

    <main class="window" aria-label="Dom Smith's terminal">
      <header class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="title">dom@dev: ~</span>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Change theme">theme</button>
      </header>

      <div class="screen" id="screen">
        <div id="output" role="log" aria-live="polite"></div>
        <form class="prompt-line" id="promptForm" autocomplete="off">
          <label for="cmd" class="ps1"><span class="user">dom@dev</span>:<span class="path">~</span>$</label>
          <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Type a command" />
        </form>
      </div>

      <nav class="chips" aria-label="Quick commands">
        <button type="button" data-cmd="whoami">whoami</button>
        <button type="button" data-cmd="ls projects">ls projects</button>
        <button type="button" data-cmd="cat about.txt">about</button>
        <button type="button" data-cmd="neofetch">neofetch</button>
        <button type="button" data-cmd="contact">contact</button>
        <button type="button" data-cmd="help">help</button>
      </nav>

      <!-- Shown only without JavaScript, so the page still says who I am and how to reach me -->
      <noscript>
        <div class="fallback">
          <p><strong>Dom Smith</strong>, IT support analyst in Los Angeles who builds things at home.</p>
          <p>Projects: a self-hosted AI setup (Ollama, Open WebUI, Tailscale), Robin and Nami (two Discord bots running in Docker on a Mac mini), and Fantasy Command Center (a dashboard for my six ESPN fantasy football teams).</p>
          <p>
            <a href="mailto:domsmith343@gmail.com">Email</a> ·
            <a href="https://github.com/domsmith343">GitHub</a> ·
            <a href="https://www.linkedin.com/in/dominicsmith343/">LinkedIn</a>
          </p>
        </div>
      </noscript>
    </main>

    <footer>© 2026 Dom Smith · built by hand, no frameworks</footer>

    <script src="main.js"></script>
  </body>
</html>
